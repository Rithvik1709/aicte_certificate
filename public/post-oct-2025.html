<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post October 2025</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
      }

      .card {
        width: min(92vw, 560px);
        border: 1px solid #5a5a5a;
        border-radius: 14px;
        padding: 30px 20px 36px;
        text-align: center;
        background: rgba(0, 0, 0, 0.85);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }

      h1 {
        margin: 0 0 26px;
        font-size: 30px;
        font-weight: 400;
      }

      .hourglass {
        width: 150px;
        height: 220px;
        margin: 0 auto;
        position: relative;
        border: 4px solid #f8fafc;
        border-radius: 10px;
        overflow: hidden;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.55), 0 0 20px rgba(255, 255, 255, 0.12);
      }

      .hourglass::before,
      .hourglass::after {
        content: '';
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 56px solid transparent;
        border-right: 56px solid transparent;
        z-index: 2;
        pointer-events: none;
      }

      .hourglass::before {
        top: 14px;
        border-top: 74px solid rgba(255, 255, 255, 0.2);
      }

      .hourglass::after {
        bottom: 14px;
        border-bottom: 74px solid rgba(255, 255, 255, 0.2);
      }

      .glass-highlight {
        position: absolute;
        inset: 6px;
        border-radius: 7px;
        border-left: 1px solid rgba(255, 255, 255, 0.6);
        border-top: 1px solid rgba(255, 255, 255, 0.35);
        background: linear-gradient(
          110deg,
          rgba(255, 255, 255, 0.16) 0%,
          rgba(255, 255, 255, 0.05) 20%,
          rgba(255, 255, 255, 0) 55%
        );
        z-index: 3;
        pointer-events: none;
      }

      .neck {
        position: absolute;
        left: 50%;
        top: 102px;
        transform: translateX(-50%);
        width: 10px;
        height: 16px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.35);
        z-index: 4;
      }

      .top-sand,
      .bottom-sand,
      .sand-stream {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        background: #ffffff;
        z-index: 5;
        opacity: 1;
      }

      .top-sand {
        top: 18px;
        width: 112px;
        height: 72px;
        clip-path: polygon(0 0, 100% 0, 60% 100%, 40% 100%);
        animation: top-fall 10s linear infinite;
      }

      .bottom-sand {
        bottom: 18px;
        width: 112px;
        height: 8px;
        clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
        animation: bottom-rise 10s linear infinite;
      }

      .sand-stream {
        top: 96px;
        width: 6px;
        height: 40px;
        border-radius: 4px;
        animation: stream-flow 1s linear infinite;
        opacity: 1;
      }

      @keyframes top-fall {
        0% {
          height: 72px;
          opacity: 1;
        }

        90% {
          height: 6px;
          opacity: 1;
        }

        100% {
          height: 72px;
          opacity: 1;
        }
      }

      @keyframes bottom-rise {
        0% {
          height: 8px;
        }

        90% {
          height: 74px;
        }

        100% {
          height: 8px;
        }
      }

      @keyframes stream-flow {
        0% {
          opacity: 1;
          transform: translateX(-50%) scaleY(0.6);
        }

        50% {
          opacity: 1;
          transform: translateX(-50%) scaleY(1);
        }

        100% {
          opacity: 1;
          transform: translateX(-50%) scaleY(0.65);
        }
      }

      .back-link {
        display: inline-block;
        margin-top: 24px;
        border: 1px solid #ffffff;
        color: #ffffff;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 10px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .back-link:hover {
        background: #ffffff;
        color: #000000;
      }

      @media (max-width: 600px) {
        body {
          padding: 14px;
        }

        .card {
          width: 100%;
          padding: 20px 14px 24px;
        }

        h1 {
          font-size: 24px;
          margin-bottom: 14px;
        }

        .hourglass {
          width: 126px;
          height: 186px;
          border-width: 3px;
        }

        .hourglass::before,
        .hourglass::after {
          border-left-width: 46px;
          border-right-width: 46px;
        }

        .hourglass::before {
          top: 11px;
          border-top-width: 60px;
        }

        .hourglass::after {
          bottom: 11px;
          border-bottom-width: 60px;
        }

        .neck {
          top: 84px;
          width: 8px;
          height: 14px;
        }

        .top-sand {
          top: 14px;
          width: 94px;
          height: 58px;
        }

        .bottom-sand {
          bottom: 14px;
          width: 94px;
        }

        .sand-stream {
          top: 79px;
          width: 5px;
          height: 32px;
        }

        .back-link {
          display: block;
          width: calc(100% - 20px);
          margin: 14px auto 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Digital signature yet to arrive</h1>
      <div class="hourglass" aria-hidden="true">
        <div class="glass-highlight"></div>
        <div class="neck"></div>
        <div class="top-sand"></div>
        <div class="sand-stream"></div>
        <div class="bottom-sand"></div>
      </div>
      <a class="back-link" href="/">Go Back</a>
    </div>
  </body>
</html>
